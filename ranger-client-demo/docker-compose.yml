# Ranger 2.9.0 (Admin, KMS, PDP) + Ranger Client demo app.
#   docker compose up -d --wait     # first start takes 3-5 minutes
#   open http://localhost:8080
#   docker compose down             # stop and wipe all data (state lives in the containers only,
#                                   # so Admin/KMS setup and the DB always start fresh together)
name: ranger-client-demo

x-ranger-build: &ranger-build
  context: ./docker
  args:
    RANGER_VERSION: ${RANGER_VERSION}
    RANGER_BASE_VERSION: ${RANGER_BASE_VERSION}

services:
  ranger-db:
    image: apache/ranger-db:${RANGER_VERSION}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -q"]
      interval: 5s
      timeout: 3s
      retries: 30

  ranger-solr:
    image: apache/ranger-solr:${RANGER_VERSION}
    command: ["solr-precreate", "ranger_audits", "/opt/solr/server/solr/configsets/ranger_audits/"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8983/solr/ranger_audits/admin/ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ranger-admin:
    image: apache/ranger:${RANGER_VERSION}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_PASSWORD}
    ports:
      - "${ADMIN_PORT}:6080"
    depends_on:
      ranger-db: {condition: service_healthy}
      ranger-solr: {condition: service_healthy}
    healthcheck:
      # create-ranger-services.py runs after the server is up and creates dev_kms, which KMS needs.
      test: ["CMD-SHELL", "curl -sf -u admin:$${RANGER_DB_PASSWORD} 'http://localhost:6080/service/public/v2/api/service/name/dev_kms' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  ranger-kms:
    build:
      <<: *ranger-build
      dockerfile: kms/Dockerfile
    image: ranger-client-demo/ranger-kms:${RANGER_VERSION}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RANGER_KMS_DB_PASSWORD: ${RANGER_KMS_DB_PASSWORD}
      KMS_MASTER_KEY_PASSWORD: ${KMS_MASTER_KEY_PASSWORD}
      # Login the KMS plugin uses to download dev_kms policies (keyadmin is created by Admin setup).
      RANGER_KMS_PLUGIN_USER: keyadmin
      RANGER_KMS_PLUGIN_PASSWORD: ${RANGER_PASSWORD}
    ports:
      - "${KMS_PORT}:9292"
    depends_on:
      ranger-admin: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9292/kms/api/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  ranger-pdp:
    build:
      <<: *ranger-build
      dockerfile: pdp/Dockerfile
    image: ranger-client-demo/ranger-pdp:${RANGER_VERSION}
    environment:
      RANGER_ADMIN_PASSWORD: ${RANGER_PASSWORD}
    ports:
      - "${PDP_PORT}:6500"
    depends_on:
      ranger-admin: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6500/health/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  demo-app:
    build:
      context: ..
      dockerfile: ranger-client-demo/app/Dockerfile
    image: ranger-client-demo/app:latest
    environment:
      RANGER_ADMIN_PASSWORD: ${RANGER_PASSWORD}
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      ranger-admin: {condition: service_healthy}
      ranger-kms: {condition: service_started}
      ranger-pdp: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/liveness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
